name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-playground:
    name: python-playground tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/python-playground

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  news-tracker:
    name: news-tracker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/news-tracker

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest -q
