name: News tracker refresh

# Fetches the RSS feeds in projects/news-tracker/sources.json and commits the
# updated JSON data files, so the dashboards (served by GitHub Pages) stay fresh.

on:
  schedule:
    # Every 30 minutes (UTC). Schedules only run on the default branch, and
    # GitHub registers them when this file changes on that branch; if runs
    # stop appearing under Actions with event "schedule", edit this file.
    # Two expressions at different minutes so one late tick doesn't starve
    # the other (GitHub can delay scheduled runs at busy times).
    - cron: "7,37 * * * *"
    - cron: "22,52 * * * *"
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    paths:
      - "projects/news-tracker/sources.json"
      - "projects/news-tracker/scripts/**"
      - ".github/workflows/news-tracker.yml"

permissions:
  contents: write

concurrency:
  group: news-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch feeds and commit data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        working-directory: projects/news-tracker
        run: python scripts/fetch_news.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/news-tracker/data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "news-tracker: refresh data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have pushed meanwhile; rebase once and retry.
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"
