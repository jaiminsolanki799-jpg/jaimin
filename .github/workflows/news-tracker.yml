name: News tracker refresh

# Fetches the RSS feeds in projects/news-tracker/sources.json and commits the
# updated JSON data files, so the dashboards (served by GitHub Pages) stay fresh.
#
# How it keeps running every 30 minutes
# -------------------------------------
# GitHub's cron schedule below has never fired in this repository, so the
# workflow keeps itself going: every run is started with a `wake_at` time (a
# half-hour mark, Unix seconds UTC). It sleeps until then, fetches, commits,
# and then makes sure runs exist for the NEXT TWO half-hour marks, creating
# any that are missing. With two sleeping runs always in flight, losing one
# (a runner shutdown, a cancelled run, an outage) does not stop the chain:
# the survivor recreates the missing one when it wakes.
#
# Starting the next runs uses the REFRESH_TOKEN repository secret (a
# personal access token with Actions read/write), because runs started with
# the built-in GITHUB_TOKEN cannot start workflows. Without the secret the
# job just fetches once and stops.
#
# To (re)start the chain by hand: Actions -> News tracker refresh ->
# Run workflow (leave wake_at empty).

run-name: ${{ inputs.wake_at && format('Refresh at {0}', inputs.wake_at) || 'News tracker refresh' }}

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "22,52 * * * *"
  workflow_dispatch:
    inputs:
      wake_at:
        description: "Unix time (UTC seconds) to wake up and refresh. Leave empty to refresh now."
        required: false
        default: ""
  push:
    paths:
      - "projects/news-tracker/sources.json"
      - "projects/news-tracker/scripts/**"
      - ".github/workflows/news-tracker.yml"

permissions:
  contents: write
  actions: read      # the scheduling step lists runs to see which wake times are covered

jobs:
  refresh:
    name: Fetch feeds and commit data
    runs-on: ubuntu-latest
    timeout-minutes: 80      # at most a 65-minute wait plus the fetch
    env:
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
    steps:
      - name: Wait until the scheduled wake-up time
        id: wake
        env:
          WAKE_AT: ${{ inputs.wake_at }}
        run: |
          now=$(date -u +%s)
          if [ -n "${WAKE_AT}" ] && [ "${WAKE_AT}" -gt "$now" ] 2>/dev/null; then
            wait=$(( WAKE_AT - now ))
            if [ "$wait" -gt 3900 ]; then wait=3900; fi
            echo "Sleeping ${wait}s until $(date -u -d @${WAKE_AT} '+%H:%M UTC')..."
            sleep "$wait"
          fi
          # The half-hour mark this run stands for: wake_at if given, else the last mark.
          now=$(date -u +%s)
          mark=${WAKE_AT:-$(( now - (now % 1800) ))}
          echo "mark=$mark" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch feeds
        id: fetch
        continue-on-error: true   # a bad feed must not break the refresh chain
        working-directory: projects/news-tracker
        run: python scripts/fetch_news.py

      - name: Commit updated data
        id: commit
        if: github.ref_name == 'main' && steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/news-tracker/data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "news-tracker: refresh data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Another run may have pushed meanwhile; rebase and retry a few times.
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            sleep 5
          done
          echo "::warning::Could not push the data commit after 3 attempts."

      # ---- keep two future runs in flight (see the note at the top) ----
      - name: Make sure the next two half-hour marks have a run
        if: always() && github.ref_name == 'main' && env.REFRESH_TOKEN != ''
        env:
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          MARK: ${{ steps.wake.outputs.mark }}
        run: |
          now=$(date -u +%s)
          mark=${MARK:-$(( now - (now % 1800) ))}
          # Wake times already covered by other queued/running runs (parsed from their names).
          covered=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/news-tracker.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\") | .display_title | capture(\"Refresh at (?<t>[0-9]+)\").t] | join(\" \")")
          echo "Covered wake times: ${covered:-none}"
          for target in $(( mark + 1800 )) $(( mark + 3600 )); do
            if [ "$target" -le "$now" ]; then continue; fi
            case " $covered " in *" $target "*) echo "$(date -u -d @$target '+%H:%M UTC') already has a run."; continue;; esac
            for attempt in 1 2 3 4; do
              if curl -sS -f -X POST \
                   -H "Accept: application/vnd.github+json" \
                   -H "Authorization: Bearer ${REFRESH_TOKEN}" \
                   "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/news-tracker.yml/dispatches" \
                   -d "{\"ref\":\"main\",\"inputs\":{\"wake_at\":\"$target\"}}"; then
                echo "Started a run for $(date -u -d @$target '+%H:%M UTC')."
                break
              fi
              echo "Dispatch failed (attempt $attempt); retrying in 20s..."
              sleep 20
            done
          done
