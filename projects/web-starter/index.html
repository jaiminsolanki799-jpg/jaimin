<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-starter</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>web-starter</h1>
      <p class="tagline">A static scaffold with no build step.</p>
    </header>

    <main>
      <section class="card">
        <h2>Counter</h2>
        <p>A small piece of wiring to confirm the JavaScript is loading.</p>
        <p class="counter-value" id="counter-value">0</p>
        <div class="button-row">
          <button type="button" id="decrement">−</button>
          <button type="button" id="increment">+</button>
          <button type="button" id="reset" class="secondary">Reset</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Edit <code>index.html</code>, <code>css/style.css</code>, and <code>js/main.js</code> to make it yours.</p>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
